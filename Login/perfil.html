
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Perfil</title>
</head>
<body>

    <h1>Meu Perfil</h1>
    <p id="mensagem"></p>
    <a href="inicio.html">Voltar ao início</a>

    <script>
        let usuario = localStorage.getItem("usuario");
        if (usuario === null) {
            window.location.href = "login.html";
        } else {
            document.getElementById("mensagem").textContent =
                "Usuário logado: " + usuario;
        }
    </script>

</body>
</html>
