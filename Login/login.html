
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    <input type="text" id="nome" placeholder="Digite seu nome">
    <button onclick="entrar()">Entrar</button>

    <script>
        function entrar() {
            let nome = document.getElementById("nome").value;
            localStorage.setItem("usuario", nome);
            window.location.href = "inicio.html";
        }
    </script>
</body>
</html>
